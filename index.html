<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAME ZONE DA FOFOCA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🎮 GAME ZONE DA FOFOCA</h1>

  <main class="container">
    
    <section class="quiz-box">
      <h2>Detector de Fofoca: Verdadeiro ou Falso?</h2>
      <p class="pergunta">O Neymar iniciou sua carreira profissional no Santos?</p>
      
      <div class="botoes-resposta">
        <button class="btn-resposta verdadeiro">Verdadeiro 🟢</button>
        <button class="btn-resposta falso">Falso 🔴</button>
      </div>

      <p class="pontos">Pontos: <span>0</span></p>
    </section>

    <section class="arcade-box">
      <h2>Minigame Arcade</h2>
      
      <div class="iframe-wrapper">
        <iframe 
          src="https://gabrielecirulli.github.io/2048/" 
          title="Jogo 2048 Arcade"
          loading="lazy">
        </iframe>
      </div>
    </section>

  </main>

  <footer>
    <p>© 2026 CHOQUEI POP - Todos os direitos reservados aos fofoqueiros de plantão</p>
  </footer>

</body>
</html>
